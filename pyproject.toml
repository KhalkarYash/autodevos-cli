[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ados"
version = "0.1.2"
description = "AI-powered coding agent for your terminal - like Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Yash Khalkar" }
]
keywords = ["ai", "agent", "cli", "coding", "llm", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.5.0",
    "tomli>=2.0.0",
    "tomlkit>=0.12.0",
    "platformdirs>=4.0.0",
    "keyring>=24.0.0",
    "ddgs>=5.0.0",
    "mcp>=1.0.0",
    "fastmcp>=2.0.0",
    "anthropic>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/KhalkarYash/autodevos-cli"
Documentation = "https://github.com/KhalkarYash/autodevos-cli#readme"
Repository = "https://github.com/KhalkarYash/autodevos-cli"
Issues = "https://github.com/KhalkarYash/autodevos-cli/issues"

[project.scripts]
# Main command - like 'code' for VSCode or 'claude' for Claude
ados = "autodevos.cli.main:main"
autodev = "autodevos.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["autodevos"]

[tool.hatch.build.targets.sdist]
include = [
    "/autodevos",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
